content: |-
  Ungulates are not just important for the survival of tigers, they’re also a key part of the wider ecosystem. They help to keep vegetation under control and play an important role in dispersing seeds across landscapes. Deer and wild cattle churn up water holes and these larger ungulates could also contribute to carbon cycling.

  ![Tigers](/uploads/_ww1118122-2386x1838.jpg "Many species, such as tigers, rely on the water holes that are churned up by large ungulates. © DoFSC / WWF Nepal")

  ## **In reality, tiger prey densities are generally low across Asia.** 

  Historic poaching has led to a decline in ungulate populations across Asia. In Southeast Asia the decline is particularly severe as a [snaring crisis](https://tigers.panda.org/reports/?364669/Silence-of-the-Snares) has striped many of the region’s forests of their wildlife. Consumption of ungulates in the region continues to drive an unsustainable demand for wild meat.

  Diseases, such as African Swine Fever, are also having detrimental impacts on wild pig populations in Asia. In the Belum-Temengor Forest Complex in Malaysia, the disease caused high levels of pig mortality in one of the last tiger strongholds in the country.

  ![muntjac](/uploads/medium_ww1299656-1200x800.jpg "A muntjac walks through Royal Belum State Park in Malaysia’s Belum-Temengor Forest Complex. © Emmanuel Rondeau / WWF-US")
